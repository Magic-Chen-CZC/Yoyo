version: 2026-05-15
description: >
  QA intent keyword and phrase library. This file is a maintenance asset for the
  rule router design; it is not wired into runtime routing yet.

routing_policy:
  scoring_language: zh
  preprocess: translate_non_zh_to_zh_before_routing
  note: >
    Runtime rule scoring should only use Chinese pivot text and Chinese
    keyword/pattern assets. Non-Chinese entries in this document are retained as
    historical/reference examples for translation-pivot debugging and should not
    be expanded into a second routing lexicon.

