conflict_policy:
  smalltalk_vs_task:
    rule: task_intent_wins
    condition: politeness_prefix + any_task_evidence
    example: 你好，请问故宫有什么历史 -> attraction_explain
  live_info_vs_attraction_explain:
    live_info_wins_if: same_day_time + live_operation
    attraction_explain_wins_if: attraction_entity + explain_action + no_live_operation
    fallback_if: both_have_strong_evidence
  weather_info_vs_live_info:
    weather_wins_if: weather_query
    live_info_wins_if: live_operation + no_weather_query
    fallback_if: broad_query_like_today_is_it_good_to_visit
  navigation_text_vs_trip_assistant:
    navigation_wins_if: navigation_action + route_slot
    trip_wins_if: next_stop_status_without_navigation_action
    fallback_if: next_stop + ambiguous_go_or_walk
  trip_assistant_vs_manual_route_edit_redirect:
    edit_wins_if: route_edit_action + route_edit_object
    trip_wins_if: route_edit_negation or advice_only
    fallback_if: soft_goal_without_clear_action
  translation_vs_attraction_explain:
    translation_wins_if: translation_action + quoted_text
    attraction_wins_if: attraction_entity + explain_action + no_translation_object
    fallback_if: translation_action + attraction_entity + no_quoted_text
