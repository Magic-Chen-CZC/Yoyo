dataset_name: routing_rule_maintenance_100_cases
dataset_version: "2026-05-15"
notes: >
  Daily QA intent rule maintenance benchmark. Cases use Chinese canonical
  queries after translator pivot. raw_query is kept for multilingual traceability
  but the router-only benchmark scores the Chinese query field.
cases:
  - case_id: RRM-ST-001
    bucket: smalltalk_only
    language: zh
    query: "你好"
    expected_intent: smalltalk
    conflict_type: none
    label_rationale: "纯寒暄，无任务内容。"
