dataset_name: routing_rule_complex_200_cases
dataset_version: "2026-05-15"
notes: >
  Complex hard-case QA intent routing benchmark. The queries are intentionally
  longer, more colloquial, and conflict-heavy. Non-Chinese examples keep raw_query
  for traceability, while query is the Chinese canonical text after translator pivot.
cases:
  - {case_id: RRC-ST-001, bucket: complex_smalltalk_identity, language: zh, query: "你好，我第一次用这个导游助手，你先说说你到底能帮我做哪些事，不用讲景点。", expected_intent: smalltalk, expected_needs_fallback: false, conflict_type: smalltalk_capability, label_rationale: "问助手能力，无具体任务。"}
  - {case_id: RRC-ST-002, bucket: complex_smalltalk_identity, language: zh, query: "你是谁啊，是不是只负责北京景点，还是也能帮我聊天？", expected_intent: smalltalk, expected_needs_fallback: false, conflict_type: smalltalk_capability, label_rationale: "问身份和能力范围。"}
  - {case_id: RRC-ST-003, bucket: complex_smalltalk_thanks, language: zh, query: "谢谢，刚才那个回答够用了，先不用继续安排。", expected_intent: smalltalk, expected_needs_fallback: false, conflict_type: smalltalk_with_non_task_tail, label_rationale: "致谢和停止，没有新任务。"}
  - {case_id: RRC-ST-004, bucket: complex_smalltalk_thanks, language: zh, query: "辛苦了，暂时没有别的问题，等我到门口再问你。", expected_intent: smalltalk, expected_needs_fallback: false, conflict_type: smalltalk_with_future_task_hint, label_rationale: "没有当前可执行任务。"}
  - {case_id: RRC-ST-005, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Hi, before we go, tell me why Jingshan is worth visiting.", query: "你好，出发前先讲讲景山为什么值得去。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: smalltalk_vs_task, label_rationale: "礼貌前缀后是景点讲解。"}
  - {case_id: RRC-ST-006, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Excuse me, is the Palace Museum still open tonight?", query: "请问，故宫今晚还开放吗？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: smalltalk_vs_task, label_rationale: "礼貌前缀后是实时开放。"}
  - {case_id: RRC-ST-007, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Thanks, how should we walk to the next stop now?", query: "谢谢，现在去下一站怎么走？", expected_intent: navigation_text, expected_needs_fallback: false, conflict_type: smalltalk_vs_navigation, label_rationale: "致谢后是下一站导航。"}
  - {case_id: RRC-ST-008, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Please help me remove Temple of Heaven from the route.", query: "麻烦帮我把天坛从路线里去掉。", expected_intent: manual_route_edit_redirect, expected_needs_fallback: false, conflict_type: smalltalk_vs_edit, label_rationale: "礼貌词后是明确改路线。"}
  - {case_id: RRC-ST-009, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Hello, will it rain near the Forbidden City this afternoon?", query: "你好，今天下午故宫附近会下雨吗？", expected_intent: weather_info, expected_needs_fallback: false, conflict_type: smalltalk_vs_weather, label_rationale: "礼貌词后是天气。"}
  - {case_id: RRC-ST-010, bucket: complex_smalltalk_task_prefix, language: zh, raw_query: "Hey, translate this for staff: I lost my ticket.", query: "你好，帮我把这句话翻给工作人员看：I lost my ticket.", expected_intent: translation, expected_needs_fallback: false, conflict_type: smalltalk_vs_translation, label_rationale: "礼貌词后是显式翻译。"}
  - {case_id: RRC-ST-011, bucket: complex_smalltalk_boundary, language: zh, query: "你好，不过我想问的是你能不能帮我推荐股票，不是旅游。", expected_intent: out_of_scope, expected_needs_fallback: false, conflict_type: hard_deny_with_smalltalk, label_rationale: "礼貌开头但核心域外。"}
  - {case_id: RRC-ST-012, bucket: complex_smalltalk_boundary, language: zh, query: "哈喽，先别讲景点，我就想知道你是不是能做医疗诊断。", expected_intent: out_of_scope, expected_needs_fallback: false, conflict_type: hard_deny_with_smalltalk, label_rationale: "医疗诊断域外。"}

  - {case_id: RRC-AT-001, bucket: complex_attraction_mixed_route, language: zh, query: "我不想现在改路线，也不是问怎么走，单纯想听听故宫为什么会被说成北京中轴线上的核心。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: trip_vs_explain_negated, label_rationale: "否定路线，明确讲解。"}
  - {case_id: RRC-AT-002, bucket: complex_attraction_mixed_live, language: zh, query: "先别查今天开不开门，能不能用两三句话讲清楚天坛祈年殿真正特别在哪里？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: live_vs_explain_negated, label_rationale: "否定实时查询，要求讲解。"}
  - {case_id: RRC-AT-003, bucket: complex_attraction_mixed_weather, language: zh, query: "天气我等会再问，你先讲讲景山为什么看故宫全景最有意思。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: weather_vs_explain_negated, label_rationale: "天气被排除，核心讲解。"}
  - {case_id: RRC-AT-004, bucket: complex_attraction_translation_negative, language: zh, query: "英文导览里反复说 imperial axis，我不是要翻译，想知道它对应北京中轴线到底意味着什么。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: translation_vs_explain_negated, label_rationale: "明确不是翻译，是概念解释。"}
  - {case_id: RRC-AT-005, bucket: complex_attraction_long, language: zh, query: "如果我只有十分钟站在天安门广场边上，你会让我重点理解哪一个历史层面的东西，而不是只是拍照？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: trip_constraint_vs_explain, label_rationale: "时间约束下的讲解重点。"}
  - {case_id: RRC-AT-006, bucket: complex_attraction_long, language: zh, query: "我知道故宫很大，但想听一个适合边走边听的故事线，不要百科式罗列。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: explain_style_request, label_rationale: "景点讲解风格请求。"}
  - {case_id: RRC-AT-007, bucket: complex_attraction_comparison, language: zh, query: "如果故宫和天坛只能慢慢看一个，你先别替我排路线，讲讲它们看点差异在哪里。", expected_intent: attraction_explain, expected_needs_fallback: true, conflict_type: compare_explain_vs_trip, label_rationale: "比较看点，可能需要 fallback 保守裁决。"}
  - {case_id: RRC-AT-008, bucket: complex_attraction_alias, language: zh, query: "颐和园不是市中心景点，但它的园林设计到底值得看在哪里？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 讲解。"}
  - {case_id: RRC-AT-009, bucket: complex_attraction_alias, language: zh, query: "圆明园如果只讲废墟会不会太单薄，它更应该理解成什么样的历史现场？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 历史解释。"}
  - {case_id: RRC-AT-010, bucket: complex_attraction_alias, language: zh, query: "北海公园我以前只当它是公园，你能讲讲它和皇家园林有什么关系吗？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 历史文化。"}
  - {case_id: RRC-AT-011, bucket: complex_attraction_alias, language: zh, query: "什刹海如果不逛酒吧街，白天看它有什么城市历史上的意义？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 城市历史。"}
  - {case_id: RRC-AT-012, bucket: complex_attraction_alias, language: zh, query: "南锣鼓巷现在很商业化，但它原来的胡同格局有什么可讲的？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 格局讲解。"}
  - {case_id: RRC-AT-013, bucket: complex_attraction_alias, language: zh, query: "雍和宫不只是烧香吧，它作为建筑和历史空间有什么重点？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 建筑历史。"}
  - {case_id: RRC-AT-014, bucket: complex_attraction_alias, language: zh, query: "恭王府如果带老人去，应该听哪些故事才不只是看院子？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: entity_alias_gap, label_rationale: "常见景点实体 + 故事讲解。"}
  - {case_id: RRC-AT-015, bucket: complex_attraction_colloquial, language: zh, query: "我妈说天坛就是个大公园，你帮我用游客能听懂的话反驳一下它为什么不只是公园。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: explain_colloquial, label_rationale: "口语化讲解。"}
  - {case_id: RRC-AT-016, bucket: complex_attraction_colloquial, language: zh, query: "故宫里那么多殿，我不想听清单，你抓一个最能体现皇权秩序的点讲。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: explain_focus, label_rationale: "讲解聚焦。"}
  - {case_id: RRC-AT-017, bucket: complex_attraction_colloquial, language: zh, query: "正阳门听起来像个城楼而已，它为什么在老北京城里位置那么关键？", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: explain_significance, label_rationale: "解释城市格局意义。"}
  - {case_id: RRC-AT-018, bucket: complex_attraction_multi_intent, language: zh, query: "等下如果有空再告诉我怎么走，现在先把景山和故宫的关系讲明白。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: navigation_deferred_vs_explain, label_rationale: "导航被延后，当前是讲解。"}
  - {case_id: RRC-AT-019, bucket: complex_attraction_multi_intent, language: zh, query: "别管今天门票了，我已经买好了，先说说天安门为什么有这么强的象征性。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: live_negated_vs_explain, label_rationale: "票务已排除，核心讲解。"}
  - {case_id: RRC-AT-020, bucket: complex_attraction_multi_intent, language: zh, query: "我不是问人多不多，想知道故宫为什么总让人觉得空间压迫感很强。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: crowd_negative_vs_explain, label_rationale: "人多不是边界，核心体验解释。"}
  - {case_id: RRC-AT-021, bucket: complex_attraction_followup, language: zh, query: "那它最核心的看点能不能再说得接地气一点？", history: [{intent: attraction_explain, content: "先讲讲故宫为什么值得第一次来北京的人去。"}], expected_intent: attraction_explain, expected_needs_fallback: true, conflict_type: followup_explain, label_rationale: "依赖历史的讲解 follow-up。"}
  - {case_id: RRC-AT-022, bucket: complex_attraction_followup, language: zh, query: "刚才你说的那个门，为什么不是普通城门？", history: [{intent: attraction_explain, content: "正阳门是北京中轴线上的重要城门。"}], expected_intent: attraction_explain, expected_needs_fallback: true, conflict_type: followup_explain, label_rationale: "省略实体，依赖历史。"}
  - {case_id: RRC-AT-023, bucket: complex_attraction_pivot, language: zh, raw_query: "Before checking tickets, explain why the Temple of Heaven mattered ritually.", query: "先别查门票，解释一下天坛在礼制上为什么重要。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: pivot_explain_vs_live, label_rationale: "英文 pivot 后明确讲解。"}
  - {case_id: RRC-AT-024, bucket: complex_attraction_pivot, language: zh, raw_query: "Jangan ubah rute, ceritakan sejarah Forbidden City secara singkat.", query: "不要改路线，简单讲讲故宫的历史。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: pivot_edit_negated_vs_explain, label_rationale: "印尼语 pivot 后否定改路线。"}
  - {case_id: RRC-AT-025, bucket: complex_attraction_negative_boundary, language: zh, query: "故宫现在网上有很多攻略，我不是要攻略，想听它作为博物院的价值。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: weak_boundary_vs_explain, label_rationale: "攻略词不应域外。"}
  - {case_id: RRC-AT-026, bucket: complex_attraction_negative_weather, language: zh, query: "今天热不热我知道了，你换个角度讲讲天坛的建筑比例为什么那么震撼。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: weather_negated_vs_explain, label_rationale: "天气已知，当前讲建筑。"}
  - {case_id: RRC-AT-027, bucket: complex_attraction_negative_live, language: zh, query: "不用查正阳门今天开不开，我只是想知道它和前门这个名字有什么关系。", expected_intent: attraction_explain, expected_needs_fallback: false, conflict_type: live_negated_vs_explain, label_rationale: "实时开放被否定，核心解释。"}
  - {case_id: RRC-AT-028, bucket: complex_attraction_ambiguous, language: zh, query: "故宫今天值得去吗？我不是只问天气，也想听它到底值不值得排进今天的行程。", expected_intent: attraction_explain, expected_needs_fallback: true, conflict_type: weather_trip_explain_ambiguous, label_rationale: "多意图混合，规则应保守。"}

  - {case_id: RRC-LI-001, bucket: complex_live_can_enter, language: zh, query: "我已经到故宫门口了，现在还能进去吗，还是今天已经停止入场了？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_entry_status, label_rationale: "当前入园状态。"}
  - {case_id: RRC-LI-002, bucket: complex_live_can_enter, language: zh, query: "天坛这会儿还能进吗？我不是问历史，就想知道现在能不能入园。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_entry_status_vs_explain, label_rationale: "明确实时入园。"}
  - {case_id: RRC-LI-003, bucket: complex_live_ticket, language: zh, query: "景山今天还能现场买票吗，还是必须提前预约？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_ticket, label_rationale: "当天票务。"}
  - {case_id: RRC-LI-004, bucket: complex_live_ticket, language: zh, query: "故宫今天下午的门票还有没有，我不想听常规开放时间。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_ticket, label_rationale: "当天余票/票务。"}
  - {case_id: RRC-LI-005, bucket: complex_live_notice, language: zh, query: "正阳门今天有没有临时公告，比如维修、封闭或者调整开放？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_notice, label_rationale: "同日公告。"}
  - {case_id: RRC-LI-006, bucket: complex_live_notice, language: zh, query: "天安门广场今天有没有预约或安检方面的最新通知？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_notice, label_rationale: "当天预约/通知。"}
  - {case_id: RRC-LI-007, bucket: complex_live_hours, language: zh, query: "故宫今天几点停止检票？我怕赶过去只剩十分钟。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_hours, label_rationale: "当天停止检票时间。"}
  - {case_id: RRC-LI-008, bucket: complex_live_hours, language: zh, query: "颐和园今晚开放到几点，夜场有没有特别安排？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_hours_entity_alias, label_rationale: "运营时间，常见景点实体。"}
  - {case_id: RRC-LI-009, bucket: complex_live_mixed_explain, language: zh, query: "故宫今天开放吗？如果开放你再简单说说为什么值得进去看。", expected_intent: live_info, expected_needs_fallback: true, conflict_type: live_primary_explain_secondary, label_rationale: "主意图 live，混合讲解，应保守。"}
  - {case_id: RRC-LI-010, bucket: complex_live_mixed_weather, language: zh, query: "天坛今天开放吗，顺便看一下下雨会不会影响入园？", expected_intent: live_info, expected_needs_fallback: true, conflict_type: live_vs_weather, label_rationale: "开放为主，天气为次，建议 fallback。"}
  - {case_id: RRC-LI-011, bucket: complex_live_mixed_navigation, language: zh, query: "如果景山现在还能进，我再问怎么走；你先帮我确认今天还开放不开放。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: navigation_deferred_vs_live, label_rationale: "先查实时开放。"}
  - {case_id: RRC-LI-012, bucket: complex_live_negative_crowd, language: zh, query: "我不是问人多不多，只想知道故宫现在还能不能进。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: crowd_negated_vs_live, label_rationale: "边界词被否定，核心入园。"}
  - {case_id: RRC-LI-013, bucket: complex_live_negative_explain, language: zh, query: "天坛历史等会再讲，先确认它今天有没有闭馆通知。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: explain_deferred_vs_live, label_rationale: "讲解延后，当前 live。"}
  - {case_id: RRC-LI-014, bucket: complex_live_pivot, language: zh, raw_query: "Is Jingshan Park still allowing entry right now?", query: "景山公园现在还允许入园吗？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: pivot_live, label_rationale: "英文 pivot 后实时入园。"}
  - {case_id: RRC-LI-015, bucket: complex_live_pivot, language: zh, raw_query: "Cung điện Mùa hè hôm nay có cần đặt vé trước không?", query: "颐和园今天需要提前预约门票吗？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: pivot_live_entity_alias, label_rationale: "越南语 pivot 后票务预约。"}
  - {case_id: RRC-LI-016, bucket: complex_live_pivot, language: zh, raw_query: "Hari ini Temple of Heaven tutup lebih awal atau tidak?", query: "天坛今天会不会提前闭馆？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: pivot_live, label_rationale: "印尼语 pivot 后闭馆时间。"}
  - {case_id: RRC-LI-017, bucket: complex_live_boundary, language: zh, query: "故宫今天门口队伍长不长我先不问，官方有没有停止入场的通知？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: crowd_negated_vs_live, label_rationale: "排队被否定，官方通知。"}
  - {case_id: RRC-LI-018, bucket: complex_live_soft, language: zh, query: "现在去北海公园还来得及吗，主要看它今天关门时间。", expected_intent: live_info, expected_needs_fallback: true, conflict_type: live_soft_suitability, label_rationale: "来得及依赖关门时间，建议 fallback。"}
  - {case_id: RRC-LI-019, bucket: complex_live_soft, language: zh, query: "下午四点之后去恭王府还能不能正常参观？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_entry_status_entity_alias, label_rationale: "参观入园状态。"}
  - {case_id: RRC-LI-020, bucket: complex_live_soft, language: zh, query: "南锣鼓巷今天有没有临时管控或者关闭的公告？", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_notice_entity_alias, label_rationale: "同日公告。"}
  - {case_id: RRC-LI-021, bucket: complex_live_compound, language: zh, query: "故宫今天门票、开放和停止入场这几个信息帮我确认一下，别展开讲历史。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_multiple_operations, label_rationale: "多项 live 运营信息。"}
  - {case_id: RRC-LI-022, bucket: complex_live_compound, language: zh, query: "我现在在路上，景山还开不开、几点关门、能不能买票，先回答这些。", expected_intent: live_info, expected_needs_fallback: false, conflict_type: live_multiple_operations, label_rationale: "多项 live 运营信息。"}
